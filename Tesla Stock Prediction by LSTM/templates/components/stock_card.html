<div class="card glass-card h-100" id="stockInfoCard">
    <div class="card-body p-4">
        <!-- Loading Skeleton -->
        <div id="stockInfoSkeleton" class="skeleton-loader d-none">
            <div class="skeleton-line w-50 mb-3" style="height: 28px;"></div>
            <div class="skeleton-line w-75 mb-4" style="height: 40px;"></div>
            <div class="row g-3">
                <div class="col-6"><div class="skeleton-line" style="height: 60px;"></div></div>
                <div class="col-6"><div class="skeleton-line" style="height: 60px;"></div></div>
            </div>
        </div>

        <!-- Stock Details Container -->
        <div id="stockInfoContent">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                <div>
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <h2 class="h4 fw-bold mb-0 text-white" id="infoTicker">--</h2>
                        <span class="badge bg-secondary-subtle text-secondary" id="infoExchange">--</span>
                        <span class="badge bg-accent-subtle text-accent" id="infoMarket">--</span>
                    </div>
                    <div class="text-secondary small fw-medium" id="infoName">Loading company profile...</div>
                </div>
                <div class="text-end">
                    <div class="d-flex align-items-baseline justify-content-end gap-1">
                        <span class="currency-symbol text-secondary fs-5" id="infoCurrencyPrefix">--</span>
                        <span class="fs-2 fw-bold font-monospace text-white" id="infoPrice">--.--</span>
                    </div>
                    <div class="d-flex align-items-center justify-content-end gap-2" id="infoChangeContainer">
                        <span class="badge font-monospace px-2 py-1" id="infoChangeBadge">--</span>
                    </div>
                </div>
            </div>

            <hr class="border-subtle my-3">

            <!-- Key Financial Metrics Grid -->
            <div class="row g-3 text-center">
                <div class="col-4">
                    <div class="metric-pill">
                        <span class="metric-label">Previous Close</span>
                        <span class="metric-value font-monospace" id="infoPrevClose">--</span>
                    </div>
                </div>
                <div class="col-4">
                    <div class="metric-pill">
                        <span class="metric-label">Market Cap</span>
                        <span class="metric-value font-monospace" id="infoMarketCap">--</span>
                    </div>
                </div>
                <div class="col-4">
                    <div class="metric-pill">
                        <span class="metric-label">Sector</span>
                        <span class="metric-value text-truncate" id="infoSector" title="--">--</span>
                    </div>
                </div>
            </div>

            <!-- 52-Week Range Bar -->
            <div class="mt-4">
                <div class="d-flex justify-content-between text-secondary small mb-1">
                    <span>52W Low: <strong class="text-light font-monospace" id="info52Low">--</strong></span>
                    <span class="text-muted">52-Week Trading Range</span>
                    <span>52W High: <strong class="text-light font-monospace" id="info52High">--</strong></span>
                </div>
                <div class="progress progress-range bg-dark" style="height: 6px;">
                    <div class="progress-bar bg-accent" id="range52ProgressBar" role="progressbar" style="width: 50%" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>
    </div>
</div>
