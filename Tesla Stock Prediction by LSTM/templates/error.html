<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ error_code }} | StockAI Predictor</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_prefix|default('') }}/static/css/style.css">
</head>
<body class="bg-dark-app text-light min-vh-100 d-flex flex-column justify-content-between">
    {% include 'components/navbar.html' %}

    <div class="container text-center py-5 my-auto">
        <div class="glass-card max-w-xl mx-auto p-5 rounded">
            <div class="display-1 fw-bold text-accent font-monospace mb-3">{{ error_code }}</div>
            <h1 class="h3 fw-bold text-white mb-3">Something went wrong</h1>
            <p class="text-secondary mb-4">{{ message }}</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-outline-light px-4">
                    <i class="bi bi-house me-1"></i> Return Home
                </a>
                <a href="/dashboard?ticker=TCS.NS" class="btn btn-accent px-4">
                    <i class="bi bi-speedometer2 me-1"></i> Open Dashboard
                </a>
            </div>
        </div>
    </div>

    <footer class="py-3 text-center text-secondary small border-top border-subtle">
        StockAI Predictor &copy; 2026.
    </footer>
</body>
</html>
